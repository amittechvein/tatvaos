# ============================================================================
#  Deploy to PRODUCTION — manual only
# ============================================================================
#  Deliberately NOT triggered by a push.
#
#  Production is the only environment where outbound mail reaches real
#  inboxes and where the data belongs to paying customers. A deploy here is a
#  decision, not a consequence of merging — so it requires a human to start it
#  and a GitHub environment approval to proceed.
# ============================================================================

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "production" to confirm'
        required: true
        type: string
      ref:
        description: 'Commit or tag to deploy (default: main)'
        required: false
        default: 'main'
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    name: Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check the typed confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "production" ]; then
            echo "Confirmation text did not match. Nothing deployed."
            exit 1
          fi

  # --------------------------------------------------------------------------
  #  CI must be GREEN for the exact commit being deployed. Not for main in
  #  general, not for a parent — for the SHA this deploy will reset the
  #  server to. Until this job existed, a red main deployed as readily as a
  #  green one, and on 27 August the tenant-isolation and mail-stack jobs
  #  were warnings nobody was forced to read.
  #
  #  "No CI run at all" fails exactly like a red one: an unexamined commit is
  #  not a passing commit. (CI now runs on every push to every branch, so
  #  from here on that case means CI is still running — wait for it.)
  # --------------------------------------------------------------------------
  ci-green:
    name: CI green for this exact commit
    needs: guard
    runs-on: ubuntu-latest
    # ------------------------------------------------------------------
    #  actions:read is what lets `gh run list` see CI's runs. Without it
    #  the API answers 403 and this job fails no matter how green CI is —
    #  which is exactly what happened on the first deploy after the date
    #  bypass expired, 3 September. The gate was written on 29 August
    #  WHILE the bypass was active, so the bypass `exit 0`d before the gh
    #  call and the API request was never executed once. It failed closed,
    #  which is the right direction, but it spent five days untested.
    #
    #  Stated so it is not rediscovered: a permissions block here REPLACES
    #  the default for this job, so contents:read must be listed too or
    #  actions/checkout above loses its access.
    # ------------------------------------------------------------------
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ----------------------------------------------------------------------
      #  EXPIRED, AS DESIGNED — this bypass stopped matching on 1 Sept 2026
      #  and nobody had to remember. Kept, not deleted: it is the record of
      #  what was disabled, why, and that it re-armed on its own. The first
      #  deploy after it expired (3 Sept) is what finally exercised the gh
      #  call below and found the missing actions:read — the cost of a
      #  bypass is that it also bypasses the testing of what it bypasses.
      #
      #  The CI free minutes ran out on 29 August, so no new commit can have
      #  a CI run until the quota resets: enforcing the gate would lock every
      #  deploy for three days. The bypass below is DATE-CONDITIONED, not
      #  commented out — on 1 September it stops matching and the gate is
      #  back, with nobody needing to remember. A disable that waits for a
      #  human to re-enable it is a disable that becomes permanent.
      #
      #  While suspended, every deploy prints a warning naming what it is:
      #  unexamined. Suspended is not deleted.
      # ----------------------------------------------------------------------
      - name: Require a successful CI run for the resolved SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "Deploy ref '${{ inputs.ref }}' resolves to $sha"

          if [ "$(date -u +%Y%m%d)" -lt 20260901 ]; then
            echo "::warning::CI-GREEN GATE SUSPENDED (CI minutes exhausted, resets 1 Sept)."
            echo "::warning::This deploy ships $sha WITHOUT CI examination. Builds ran on a laptop or nowhere."
            echo "The gate re-arms automatically on 2026-09-01."
            exit 0
          fi

          runs=$(gh run list \
                   --repo "$GITHUB_REPOSITORY" \
                   --workflow ci.yml \
                   --commit "$sha" \
                   --json status,conclusion,databaseId)
          echo "CI runs for this commit: $runs"

          success=$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')
          total=$(echo "$runs" | jq 'length')

          if [ "$total" -eq 0 ]; then
            echo "::error::No CI run exists for $sha. An unexamined commit does not deploy."
            echo "If CI is still running, wait for it. If this commit predates"
            echo "CI-on-every-branch, push it to a branch and let CI examine it."
            exit 1
          fi
          if [ "$success" -eq 0 ]; then
            echo "::error::CI ran for $sha and did not succeed. A red commit does not deploy."
            exit 1
          fi
          echo "CI is green for $sha — proceeding."

  deploy:
    name: Deploy to production
    needs: [guard, ci-green]
    runs-on: ubuntu-latest
    # Requires a reviewer in GitHub -> Settings -> Environments -> production.
    # A typed string is a speed bump; an approval is a second person.
    environment:
      name: production
      url: https://core.tatvaos.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /srv/tatvaos-production
            git fetch --all --prune

            # ------------------------------------------------------------
            #  Two bugs lived in the single line this replaces, and only
            #  one of them ever spoke up.
            #
            #  LOUD: `git reset --hard main` died with "ambiguous argument
            #  'main': both revision and filename" on 3 Sept, because a
            #  path named main exists in this checkout. The `--` below is
            #  git's own prescribed cure: everything before it is a
            #  revision, full stop.
            #
            #  SILENT, and the reason this is not a one-character fix:
            #  `git fetch` does NOT move the local branch you have checked
            #  out. So `reset --hard main` reset to the SERVER's stale
            #  local main, not to what was just merged - it happened to
            #  land on the right commit only because HEAD was already
            #  there. A deploy that silently ships the previous commit is
            #  the failure this whole gate chain exists to prevent, and it
            #  was sitting one branch-name collision away the entire time.
            #
            #  So: prefer the remote-tracking ref when the input names a
            #  branch, and fall through unchanged for a tag or a SHA,
            #  which have no origin/ form.
            # ------------------------------------------------------------
            TARGET='${{ inputs.ref }}'
            if git rev-parse --verify --quiet "refs/remotes/origin/$TARGET" >/dev/null; then
                TARGET="origin/$TARGET"
            fi
            git reset --hard "$TARGET" --
            echo "Server is now at $(git rev-parse HEAD) ($TARGET)"
            # deploy.sh takes its own pre-deploy database backup and refuses
            # to continue if that fails.
            CI=1 ./infra/scripts/deploy.sh production
            # deploy.sh already ran verify-live.sh as its final step; this
            # second, EXPLICIT call is the workflow's own signature on the
            # same contract. If deploy.sh ever loses that step, the deploy
            # still cannot go green over a mail edge that does not answer.
            # One script, one definition of "up", every entrance.
            bash infra/scripts/verify-live.sh

      # ----------------------------------------------------------------------
      #  What the three curls below prove — and what they do NOT.
      #
      #  They prove Caddy routes three HTTP paths from the outside world. All
      #  three returned 200 on 27 August while Dovecot was dead and mail
      #  queued for hours: an HTTP 200 proves a site block, never mail. The
      #  checks that prove mail (IMAP greeting + certificate, SMTP banners,
      #  queue age) live in infra/scripts/verify-live.sh, which ran on the
      #  box in the SSH step above. These curls add exactly one thing it
      #  cannot see from inside: that the box is reachable from OUTSIDE.
      #
      #  No -k on these curls. -k made a bad certificate pass the gate; a
      #  certificate mail clients would refuse must fail a deploy, not
      #  decorate one.
      # ----------------------------------------------------------------------

      # There is no api.tatvaos.com. The API sits behind core.tatvaos.com/api,
      # so that both share a registrable domain and one auth cookie covers
      # Core and Mail. An earlier version of this step polled a hostname that
      # has never existed, which would have failed every production deploy at
      # the final gate.
      - name: HTTP reachable from outside
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://core.tatvaos.com/health || true)
            [ "$code" = "200" ] && { echo "healthy"; exit 0; }
            sleep 6
          done
          echo "Production did not become healthy — investigate immediately"
          exit 1

      - name: API sees its database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://core.tatvaos.com/health/db || true)
          [ "$code" = "200" ] || { echo "Database unreachable from the API"; exit 1; }
          echo "database reachable"

      - name: Mail HTTP site block routes
        run: |
          # Proves the mail.tatvaos.com conf.d fragment is mounted and routing
          # HTTP. It proves nothing about IMAP, SMTP or delivery — those are
          # verify-live.sh's checks, which already ran on the box.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://mail.tatvaos.com/ || true)
          case "$code" in
            200|301|302|307|308) echo "mail HTTP site block responding ($code)" ;;
            *) echo "mail.tatvaos.com returned $code — check the conf.d mount"; exit 1 ;;
          esac

      - name: If this failed
        if: failure()
        run: |
          echo "Deploy failed. On the production server:"
          echo "  cd /srv/tatvaos-production"
          echo "  git log --oneline -5"
          echo "  git reset --hard <previous-sha> && ./infra/scripts/deploy.sh production"
          echo "  Pre-deploy backup: backups/pre-deploy-*.sql"
