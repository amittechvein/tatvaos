# ============================================================================
#  CI — runs on pushes to MAIN, and on every pull request. Nothing else.
# ============================================================================
#  Nothing deploys from here. This only answers "is the code sound", so that a
#  deploy workflow never has to.
#
#  BUDGET DECISION, 29 August 2026: CI-on-every-branch exhausted the 2,000
#  free minutes in under a month, so push builds are narrowed to main. The
#  cost of this narrowing is stated rather than discovered: a branch that is
#  merged locally WITHOUT a pull request is examined only AFTER it lands on
#  main — post-hoc, like the 27th. Open a PR and CI runs before the merge;
#  that is now the only pre-merge examination there is.
#
#  The PUSH trigger is exactly [main] — NOT the old [main, 'feat/**', 'fix/**'].
#  That glob list silently skipped whatever it didn't name ('feature/…'
#  missed 'feat/**' by four characters, same night, same author, one branch
#  built and one didn't). A list that names SOME branches promises more than
#  it delivers; main-only promises little and delivers exactly that. If this
#  filter ever changes again, this header changes in the same commit.
#
#  The PULL REQUEST trigger has NO branch filter, since 13 Sept 2026. It used
#  to be `branches: [main]` too, which filters on the BASE branch - so a PR
#  stacked on another PR's branch (#89 on #88) never ran CI at all, and a
#  green tick on the top of a stack meant nothing had been examined. With one
#  developer across five lanes, stacks are the normal shape of work. Every PR
#  runs, whatever it targets; the minutes cost is the price of the promise.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose. package.json already declares
      # "packageManager": "pnpm@9.15.0", and the action refuses to run when
      # both are set. One source of truth, and it is the one the developers
      # on their laptops also obey via corepack.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - run: dotnet restore
        working-directory: apps/api

      # Warnings are errors in the csproj. A nullable warning on a tenant id is
      # exactly the kind of thing that must not reach a review, let alone a deploy.
      - run: dotnet build --no-restore -c Release
        working-directory: apps/api

      # ------------------------------------------------------------------
      #  The Connect console checks under tests/. Each compiles production
      #  source files LINKED, not copied, needs no packages and no database,
      #  and exits non-zero on a failed assertion — so `dotnet run` IS the
      #  assertion, and a red here names the rule that broke.
      #
      #  Added 16 Sept 2026, CTO ruling: "a check that does not run is
      #  documentation, which is rule 8". connect-order exists because the
      #  meetings list sorted one way for four weeks while its document and
      #  its own comment said another; it, connect-wire and connect-minutes
      #  had only ever run when somebody remembered. connect-share has the
      #  same shape and joins them.
      #
      #  One step per check, not one step for all: a red names WHICH check in
      #  the job summary without anyone opening the log. GitHub runs `run:`
      #  under `bash -e`, so a failing `dotnet run` fails its step.
      #
      #  Not here, deliberately: tests/connect-pip (Node, driven by
      #  infra/scripts/connect-pip-test.sh) and tests/connect-whisper (Python,
      #  calls a paid transcription API). Different runtimes, and the second
      #  must not spend money on every push.
      # ------------------------------------------------------------------
      - name: "Connect check: meetings-list order"
        run: dotnet run --project tests/connect-order
      - name: "Connect check: LiveKit wire format"
        run: dotnet run --project tests/connect-wire
      - name: "Connect check: minutes"
        run: dotnet run --project tests/connect-minutes
      - name: "Connect check: screen-share mode"
        run: dotnet run --project tests/connect-share

  isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    # ------------------------------------------------------------------
    #  THE GATE THAT MATTERS.
    #
    #  Runs against a REAL PostgreSQL, because row-level security does not
    #  exist in an in-memory provider — every test would pass and prove
    #  nothing. A cross-tenant leak is the one bug this product does not
    #  recover from, so this job blocks the merge.
    # ------------------------------------------------------------------
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: tatvaos_mail
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      #  The runner image ships a third-party Chrome apt source whose index
      #  intermittently fails the hash check, and a bare `apt-get update`
      #  fails the whole job on it (#84's 2/4 red, 12 Sept 2026). We install
      #  nothing from that source, so it is removed before the update rather
      #  than retried around. If the update still fails, the failure is ours.
      # ------------------------------------------------------------------
      - name: Install client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply schema
        env: { PGPASSWORD: devpass }
        run: |
          for f in local/postgres/init/*.sql; do
            echo "-- $f"
            psql -h localhost -U postgres -d tatvaos_mail -v ON_ERROR_STOP=1 -f "$f"
          done

      # ------------------------------------------------------------------
      #  Runs the SAME script the developers run locally. It used to be
      #  reimplemented inline here, the two drifted, and a psql command-tag
      #  bug that had already been fixed in the local copy reappeared in
      #  this one. Only the connection details differ, so only the
      #  connection details are parameterised.
      # ------------------------------------------------------------------
      - name: Assert isolation holds
        env:
          PGPASSWORD: devpass
          TATVAOS_PSQL_MODE: direct
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: tatvaos_mail
        run: bash tests/isolation/test-isolation.sh

  mail-stack:
    name: Mail stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        working-directory: local
        run: docker compose up -d --build

      # Same Chrome-source removal as the isolation job, for the same flake.
      - name: Install swaks
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq swaks

      - name: Wait for readiness
        run: sleep 25

      - name: Mail flow and reject paths
        working-directory: local
        run: bash ./scripts/test-mail.sh

      - name: Logs on failure
        if: failure()
        working-directory: local
        run: docker compose logs --tail 80
