# ============================================================================
#  CI — runs on pushes to MAIN, and on every pull request. Nothing else.
# ============================================================================
#  Nothing deploys from here. This only answers "is the code sound", so that a
#  deploy workflow never has to.
#
#  BUDGET DECISION, 29 August 2026: CI-on-every-branch exhausted the 2,000
#  free minutes in under a month, so push builds are narrowed to main. The
#  cost of this narrowing is stated rather than discovered: a branch that is
#  merged locally WITHOUT a pull request is examined only AFTER it lands on
#  main — post-hoc, like the 27th. Open a PR and CI runs before the merge;
#  that is now the only pre-merge examination there is.
#
#  The PUSH trigger is exactly [main] — NOT the old [main, 'feat/**', 'fix/**'].
#  That glob list silently skipped whatever it didn't name ('feature/…'
#  missed 'feat/**' by four characters, same night, same author, one branch
#  built and one didn't). A list that names SOME branches promises more than
#  it delivers; main-only promises little and delivers exactly that. If this
#  filter ever changes again, this header changes in the same commit.
#
#  The PULL REQUEST trigger has NO branch filter, since 13 Sept 2026. It used
#  to be `branches: [main]` too, which filters on the BASE branch - so a PR
#  stacked on another PR's branch (#89 on #88) never ran CI at all, and a
#  green tick on the top of a stack meant nothing had been examined. With one
#  developer across five lanes, stacks are the normal shape of work. Every PR
#  runs, whatever it targets; the minutes cost is the price of the promise.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose. package.json already declares
      # "packageManager": "pnpm@9.15.0", and the action refuses to run when
      # both are set. One source of truth, and it is the one the developers
      # on their laptops also obey via corepack.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - run: dotnet restore
        working-directory: apps/api

      # Warnings are errors in the csproj. A nullable warning on a tenant id is
      # exactly the kind of thing that must not reach a review, let alone a deploy.
      - run: dotnet build --no-restore -c Release
        working-directory: apps/api

      # ------------------------------------------------------------------
      #  The Connect console checks under tests/. Each compiles production
      #  source files LINKED, not copied, needs no packages and no database,
      #  and exits non-zero on a failed assertion — so `dotnet run` IS the
      #  assertion, and a red here names the rule that broke.
      #
      #  Added 16 Sept 2026, CTO ruling: "a check that does not run is
      #  documentation, which is rule 8". connect-order exists because the
      #  meetings list sorted one way for four weeks while its document and
      #  its own comment said another; it, connect-wire and connect-minutes
      #  had only ever run when somebody remembered. connect-share has the
      #  same shape and joins them.
      #
      #  One step per check, not one step for all: a red names WHICH check in
      #  the job summary without anyone opening the log. GitHub runs `run:`
      #  under `bash -e`, so a failing `dotnet run` fails its step.
      #
      #  Not here, deliberately: tests/connect-pip (Node, driven by
      #  infra/scripts/connect-pip-test.sh) and tests/connect-whisper (Python,
      #  calls a paid transcription API). Different runtimes, and the second
      #  must not spend money on every push.
      # ------------------------------------------------------------------
      - name: "Connect check: meetings-list order"
        run: dotnet run --project tests/connect-order
      - name: "Connect check: LiveKit wire format"
        run: dotnet run --project tests/connect-wire
      - name: "Connect check: minutes"
        run: dotnet run --project tests/connect-minutes
      - name: "Connect check: screen-share mode"
        run: dotnet run --project tests/connect-share
      # Every token signed with Jwt:SigningKey carries its type, and every
      # verifier accepts only its own (access at+jwt, Connect download ticket,
      # MFA challenge). Mr. Singh, in a ruling that reached this lane by
      # 28 Sept 2026 (given in a separate session): "make the distinction
      # structural, not observed."
      - name: "Auth check: every token type is checked for its own type"
        run: dotnet run --project tests/token-types

      # Hire: HireAccess is the only route to Hire's records — job openings,
      # candidates, applications, their history and the pipeline. A handler
      # that read a table directly would show a hiring manager every job or
      # candidate in the organisation with nothing looking wrong. Source scan,
      # no database. Mr. Singh, 24 Sept 2026 (PR 264): "make the gate structural".
      - name: "Hire check: the Hire access gate has no way around it"
        run: bash tests/hire/check-job-gate.sh

      # The development-only operator sign-in (PR 281). Approved into CI by
      # Mr. Singh, 25 Sept 2026. Both need no database. gates/ compiles
      # DevOperatorGate.cs linked and asks it every question production could
      # (environment, switch, caller address, forwarded headers, database
      # host). check-signin-tail.sh fails if CompleteSignInAsync — the tail
      # every sign-in shares, internal since PR 281 — gains a caller outside
      # the known sign-in paths.
      - name: "Dev operator check: every gate answers as production needs"
        run: dotnet run --project tests/dev-operator/gates
      - name: "Dev operator check: only known sign-in paths reach the session tail"
        run: bash tests/dev-operator/check-signin-tail.sh

      # Every tenant-owned entity carries an EF query filter, or this fails.
      # Mr. Singh's ruling on 0007, 24 Sept 2026: "The rule lives in a test,
      # not a comment." Builds the EF model offline (no database). Today's
      # gaps are listed by name in the test and can only shrink.
      - name: "Tenancy check: every tenant-owned entity has a query filter"
        run: dotnet run --project tests/tenant-filters

      # Every AI entry point asks AiGate before sending, and every AI feature
      # label has an organisation list (Mr. Singh, 30 Sept 2026, after a
      # customer used Mail AI before its privacy text existed). Source scan,
      # no database. deploy.sh runs the same file before it builds.
      - name: "AI check: every entry point asks its organisation list"
        run: python3 tests/ai/every_ai_entry_calls_gate.py apps/api

  isolation:
    name: Tenant isolation
    runs-on: ubuntu-latest
    # ------------------------------------------------------------------
    #  THE GATE THAT MATTERS.
    #
    #  Runs against a REAL PostgreSQL, because row-level security does not
    #  exist in an in-memory provider — every test would pass and prove
    #  nothing. A cross-tenant leak is the one bug this product does not
    #  recover from, so this job blocks the merge.
    # ------------------------------------------------------------------
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: tatvaos_mail
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      #  The runner image ships a third-party Chrome apt source whose index
      #  intermittently fails the hash check, and a bare `apt-get update`
      #  fails the whole job on it (#84's 2/4 red, 12 Sept 2026). We install
      #  nothing from that source, so it is removed before the update rather
      #  than retried around. If the update still fails, the failure is ours.
      # ------------------------------------------------------------------
      - name: Install client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply schema
        env: { PGPASSWORD: devpass }
        run: |
          for f in local/postgres/init/*.sql; do
            echo "-- $f"
            psql -h localhost -U postgres -d tatvaos_mail -v ON_ERROR_STOP=1 -f "$f"
          done

      # ------------------------------------------------------------------
      #  Runs the SAME script the developers run locally. It used to be
      #  reimplemented inline here, the two drifted, and a psql command-tag
      #  bug that had already been fixed in the local copy reappeared in
      #  this one. Only the connection details differ, so only the
      #  connection details are parameterised.
      # ------------------------------------------------------------------
      - name: Assert isolation holds
        env:
          PGPASSWORD: devpass
          TATVAOS_PSQL_MODE: direct
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: tatvaos_mail
        run: bash tests/isolation/test-isolation.sh

  # ------------------------------------------------------------------
  #  The verification scripts that, until 17 Sept 2026, ran on one laptop:
  #  the OpenID Connect provider's three stage scripts (tests/oidc, decision
  #  0004) and the Connect picture-in-picture check (tests/connect-pip). CTO
  #  ruling, 17 Sept: one job for them, because "a check that does not run
  #  is documentation" (rule 8) and these had only ever run when somebody
  #  remembered.
  #
  #  The same scripts the developer runs locally, with only the connection
  #  details parameterised (the isolation job's lesson). Stage 1 needs an
  #  API already listening; stages 2 and 3 start their own. Each is its own
  #  step so a red names WHICH script without opening the log.
  #
  #  Not here: tests/connect-whisper, which needs the production env file
  #  rendered through docker compose and, for test.py, a paid transcription
  #  API that must not be spent on every push.
  # ------------------------------------------------------------------
  verification:
    name: Verification scripts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: tatvaos_mail
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']

    env:
      # What every stage script needs to find Postgres and the tools. The
      # scripts default to Docker or WSL on a laptop; here it is the service.
      PGPASSWORD: devpass
      TATVAOS_PSQL: psql -h localhost -U postgres -d tatvaos_mail -Atc
      TATVAOS_PSQL_APP: psql postgresql://tatvaos_app:dev_app_pw@localhost/tatvaos_mail -Atc
      TATVAOS_PG_HOST: localhost
      TATVAOS_PYTHON: python3
      # The API's environment for the stage that needs one started here.
      JWT_SIGNING_KEY: ci-only-key-at-least-32-characters-long-x
      ASPNETCORE_ENVIRONMENT: Development
      Oidc__Issuer: https://core.tatvaos.com
      Smtp__Host: localhost
      Smtp__Port: '5870'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply schema
        run: |
          for f in local/postgres/init/*.sql; do
            echo "-- $f"
            psql -h localhost -U postgres -d tatvaos_mail -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Build the API
        run: dotnet build -c Release apps/api/TatvaOS.Api.csproj

      # Stage 1 expects an API already on :5000. Started here with a key
      # directory of its own; stopped before the next stage starts another.
      - name: "OIDC stage 1: applications and stores"
        run: |
          mkdir -p "$RUNNER_TEMP/oidc-keys-1"
          Oidc__KeyDirectory="$RUNNER_TEMP/oidc-keys-1" ASPNETCORE_URLS=http://localhost:5000 \
            dotnet run --no-build -c Release --project apps/api/TatvaOS.Api.csproj > "$RUNNER_TEMP/api-stage1.log" 2>&1 &
          for _ in $(seq 1 150); do
            curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/health 2>/dev/null | grep -q 200 && break
            sleep 1
          done
          TATVAOS_API_LOG="$RUNNER_TEMP/api-stage1.log" bash tests/oidc/stage1-applications.sh
          rc=$?
          fuser -k 5000/tcp >/dev/null 2>&1 || true
          exit $rc

      - name: "OIDC stage 2: keys, discovery, rotation"
        run: bash tests/oidc/stage2-discovery.sh

      - name: "OIDC stage 3: the ten-step flow"
        run: bash tests/oidc/stage3-flow.sh

      # The organisation API: keys that create people and schedule meetings,
      # so its refusals are the thing worth running on every push, not only
      # the happy path. Also the only check that a scheduled meeting reaches
      # a calendar at all.
      - name: "Organisation API: people, meetings and the calendar"
        run: bash tests/orgapi/test-org-api.sh

      # TatvaOS Hire: job openings, the hiring team, candidates and
      # applications. Mostly refusals — another organisation's office or
      # person, a confidential draft title reaching a public address, a hiring
      # manager seeing someone else's job or candidate, a rejection with no
      # reason, personal data surviving an erasure in the audit log.
      # Approved by Mr. Singh, 24 Sept 2026 (PR 262 review).
      - name: "Hire: job openings, the hiring team, candidates and applications"
        run: bash tests/hire/test-job-openings.sh

      # The public careers page (decision 0010 §1): the first unauthenticated
      # read of Hire data. Checks what a stranger must NOT get — other states,
      # other organisations, private fields — and that both switches fail
      # closed. Restores the platform switch on exit.
      - name: "Hire: the public careers page shows only what it may"
        run: bash tests/hire/test-careers.sh

      # The development-only operator sign-in, against the BUILT API in six
      # configurations: refuses to boot as Production/Staging with the switch
      # on; not mapped with it off (CI's own Development included); a real
      # operator session only with Development + switch + loopback database;
      # refused (409) against the same database by a non-loopback address.
      # Mr. Singh, 25 Sept 2026. Starts its own API on :5083.
      - name: "Dev operator: impossible outside Development, proven on the built API"
        run: bash tests/dev-operator/test.sh

      # Decision 0009: an administrator sets a recovery email. Reads the mail it
      # sends (decoded MIME) from a local SMTP sink, and runs the real hold
      # worker with a hold due. Approved into CI by Mr. Singh, 27 Sept 2026.
      - name: "0009: an administrator sets a recovery email"
        run: |
          node tests/support/smtp-sink.mjs > /tmp/smtp-sink.out 2>&1 &
          for _ in $(seq 1 20); do [ -f .tmp/mail-sink.log ] && break; sleep 0.5; done
          TATVAOS_MAIL_SINK_LOG="$PWD/.tmp/mail-sink.log" bash tests/recovery-admin/test-admin-recovery-email.sh

      # Two-step recovery codes: enrols a person with a real TOTP code, then
      # measures the codes the API issues (>= 80 bits each: 0024-mfa.sql's
      # unsalted SHA-256 depends on it), hash-only storage, one use each.
      # Red on c7cb110 at 50 bits. Approved into CI by Mr. Singh on 29 Sept 2026, for when Actions returns.
      - name: "MFA: recovery codes are 80 bits, stored hashed, used once"
        run: bash tests/mfa/test-recovery-codes.sh

      # Connect's tenantless paths, walked (decision 0007): every entry point
      # that starts with no session and finds the organisation some other way.
      # Mr. Singh, 1 Oct 2026 (PR 340 review): "add the Connect isolation
      # tests to CI. All of them ... A test suite that never runs in CI is a
      # suite that passes on the laptop until someone forgets to run it."
      # Each starts, and stops, its own API on its own port (5087, 5103-5105).
      - name: "Connect isolation: every read of a meeting is filtered"
        run: bash tests/connect-isolation/test-meeting-filter-paths.sh

      - name: "Connect isolation: the anonymous recording-share link"
        run: bash tests/connect-isolation/test-recording-share-link.sh

      - name: "Connect isolation: the ticketed download and the screen-share event"
        run: bash tests/connect-isolation/test-ticket-and-screenshare.sh

      # The real notes worker over two organisations, reading the minutes it
      # mails from the SMTP sink. The sink is started only if nothing is
      # listening yet: the 0009 step starts one too, and a second would fail
      # to bind while the first kept answering. ~3 minutes (the worker waits a
      # minute after start and ticks every minute).
      - name: "Connect isolation: the minutes worker, two organisations"
        run: |
          if ! curl -s -o /dev/null http://127.0.0.1:5198/mail; then
            node tests/support/smtp-sink.mjs > /tmp/smtp-sink-connect.out 2>&1 &
          fi
          for _ in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:5198/mail && break; sleep 0.5; done
          bash tests/connect-isolation/test-minutes-worker.sh

      - name: Install the web app's TypeScript (for the PiP check)
        run: pnpm install --frozen-lockfile

      - name: "Connect check: picture-in-picture grid"
        run: bash infra/scripts/connect-pip-test.sh

  # Docs: the file Space serves is built on the server (decision 0011
  # condition 1). A job of its own: the render service needs Node 24 (it runs
  # the editor's TypeScript schema directly), and the end-to-end test builds
  # its own throwaway database (house rule 13) rather than sharing one.
  # Approved into CI by Mr. Singh (1 Oct 2026: "the Docs render and container
  # tests, with PR 367").
  docs-render:
    name: Docs render (service, gate, end to end, container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: tatvaos_mail
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']
    env:
      # tests/lib/throwaway-db.sh, outside WSL, uses psql with these.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: devpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # The server-wide roles (tatvaos_app, tatvaos_mailedge) exist on every
      # real Postgres before a throwaway database is made; on this fresh service
      # they do not. Without this step the first migration CREATES them inside
      # the throwaway run, and throwaway-db.sh rightly stops: "a migration
      # changed a SERVER-WIDE role" (PR 367's first CI run, 1 Oct 2026). The
      # same step as the Verification scripts job.
      - name: Apply schema (creates the server-wide roles)
        run: |
          for f in local/postgres/init/*.sql; do
            echo "-- $f"
            psql -h localhost -U postgres -d tatvaos_mail -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: "Render service: its own tests"
        working-directory: apps/render
        run: node --import ./src/register.mjs --test test/*.test.mjs

      # The gate Mr. Singh set before any building: the server's file is the
      # same document as the editor reloaded from storage, for every fixture,
      # and the editor's first view differs from that only by the closed list
      # of known storage drops (0011 condition 4). The comparison is calibrated.
      - name: "Render gate: the same document, and the closed list of storage drops"
        working-directory: apps/render
        run: node --import ./spike/register.mjs spike/gate.mjs

      - name: Build the API
        run: dotnet build -c Release apps/api/TatvaOS.Api.csproj

      # Its own throwaway database; the test starts the render service, STOPS
      # it to prove a failed render fails the save, and holds two builds to
      # prove an older one never overwrites a newer file.
      - name: "Docs end to end: the file is the server's"
        run: bash tests/docs/run-docs-live.sh

      # The operator's switch with production's refusal added back: after the
      # server render, switching on works (red before ServerRenderLanded: 409).
      - name: "Docs switch: as production runs it"
        env:
          Docs__RefuseSwitchOnInDevelopment: 'true'
          DOCS_TEST: tests/docs/docs-switch-production.test.mjs
        run: bash tests/docs/run-docs-live.sh

      # The container's hardening, each condition proven against the real
      # compose definition, red first on the network rule. Docker is already
      # running on the runner, so the script leaves it as it found it.
      - name: "Render container: no internet, no database, API only, non-root, read-only, limits"
        run: bash tests/docs-render/container-test.sh

      # Decision 0011 condition 2 (Typst approved by Mr. Singh, 1 Oct 2026, with
      # four conditions): the PDF gate, in the render container's own limits.
      # Text = the server's text; document text never becomes Typst code (red
      # first); a locked root; shaping equal to HarfBuzz's for every Indian
      # script; inside the time and memory caps.
      - name: "PDF gate: Typst, data never markup, shaping, limits"
        env:
          PDF_GATE_OUT: ${{ runner.temp }}/pdf-gate
        run: bash tests/docs-render/pdf-gate.sh

      # The sample PDFs, for the people who check a script by reading it
      # (Amit, 1 Oct 2026: a script is switched on only after a reader checks).
      - name: "PDF gate: keep the sample PDFs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-gate-samples
          path: ${{ runner.temp }}/pdf-gate/*.pdf
          retention-days: 14
          if-no-files-found: ignore

  mail-stack:
    name: Mail stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        working-directory: local
        run: docker compose up -d --build

      # Same Chrome-source removal as the isolation job, for the same flake.
      - name: Install swaks
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq swaks

      - name: Wait for readiness
        run: sleep 25

      - name: Mail flow and reject paths
        working-directory: local
        run: bash ./scripts/test-mail.sh

      - name: Logs on failure
        if: failure()
        working-directory: local
        run: docker compose logs --tail 80

  # Sheets (PR 342). Until 1 Oct 2026 CI ran NO Sheets test, so a green run
  # said nothing about Sheets — and "merge only after CI green" was Mr.
  # Singh's condition for this PR. Its own job so its result reads as Sheets'.
  # Same footing as the Docs job: Postgres 17, each end-to-end run on its own
  # throwaway database (rule 13), the roles made first.
  sheets:
    name: Sheets (unit, guard, end to end, switch)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: tatvaos_mail
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: devpass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install client
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # The server-wide roles, as in the Docs job (see there).
      - name: Apply schema (creates the server-wide roles)
        run: |
          for f in local/postgres/init/*.sql; do
            echo "-- $f"
            psql -h localhost -U postgres -d tatvaos_mail -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: "Sheets: the engine, model and .xlsx reader/writer"
        run: node --import ./tests/sheets/register.mjs --test tests/sheets/*.test.ts

      # Every refusal with its permit case; CONTROL=permit-all / refuse-all
      # are the calibrations (tests/sheets-xlsx-guard). The real-Excel check
      # (excel-check.ps1) needs Windows + Excel and stays a laptop run.
      - name: "Sheets: XlsxGuard against our own files and the attack corpus"
        run: |
          node --import ./tests/sheets/register.mjs tests/sheets-xlsx-guard/make-ours.ts "$RUNNER_TEMP/ours"
          OURS="$RUNNER_TEMP/ours" dotnet run --project tests/sheets-xlsx-guard -c Release

      - name: Build the API
        run: dotnet build -c Release apps/api/TatvaOS.Api.csproj

      - name: "Sheets end to end: live editing, the .xlsx, the guard, documents and spreadsheets apart"
        env:
          SHEETS_API: http://localhost:5141/api
          NODE_OPTIONS: --import ./tests/sheets/register.mjs
          DOCS_TEST: tests/sheets/sheets-live.e2e.ts
        run: bash tests/docs/run-docs-live.sh

      # As production runs it: switch-on refused until Sheets' own server build.
      - name: "Sheets switch: refused before its server build"
        env:
          Sheets__RefuseSwitchOnInDevelopment: 'true'
          DOCS_TEST: tests/sheets/sheets-switch-production.test.mjs
        run: bash tests/docs/run-docs-live.sh
