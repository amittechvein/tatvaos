# ============================================================================
#  Dovecot  -  TatvaOS Mail local development
# ============================================================================
#  Two jobs:
#    LMTP :24   accepts mail handed over by Postfix and writes it to a maildir
#    IMAP :143  serves that mail to clients (Thunderbird, your app)
#
#  Auth comes from PostgreSQL via the tatvaos_mailedge role, which can read
#  the mailboxes table and nothing else.
# ============================================================================

protocols = imap lmtp
listen    = *

# Container logging
log_path      = /dev/stderr
info_log_path = /dev/stdout

# ----------------------------------------------------------------------------
# TLS  -  DISABLED FOR LOCAL DEV ONLY
# ----------------------------------------------------------------------------
#  Everything here runs on a private Docker network on your own machine.
#  Production terminates TLS on 993/465 and sets disable_plaintext_auth = yes.
#  These two lines are the ones that must never reach a real server.
# ----------------------------------------------------------------------------
ssl = no
disable_plaintext_auth = no

auth_mechanisms = plain login

# Usernames are full email addresses, lowercased before lookup.
auth_username_format = %Lu

# ----------------------------------------------------------------------------
# Mail location
# ----------------------------------------------------------------------------
#  %d = domain part, %n = local part.
#  amit@techvein.local -> /var/mail/vhosts/techvein.local/amit
#
#  Maildir (one file per message) rather than mbox: concurrent-safe, and
#  deleting a message is a file unlink instead of a rewrite of the whole store.
# ----------------------------------------------------------------------------
mail_location = maildir:/var/mail/vhosts/%d/%n

mail_uid = vmail
mail_gid = vmail

first_valid_uid = 5000
last_valid_uid  = 5000

# Dovecot's parser takes ONE setting per line. A block written as
#     mailbox Drafts { special_use = \Drafts; auto = subscribe }
# fails with "Garbage after '{'" - semicolons are not statement separators here.
namespace inbox {
    inbox = yes
    separator = /

    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }
    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }
    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }
    mailbox Trash {
        special_use = \Trash
        auto = subscribe
    }
}

# ----------------------------------------------------------------------------
# Authentication  -  passwords from PostgreSQL
# ----------------------------------------------------------------------------
passdb {
    driver = sql
    args   = /etc/dovecot/dovecot-sql.conf.ext
    # EXPLICIT, not left to a default nobody remembers: when the account
    # password does not match, fall through to the app-password store below.
    # Without this line the second passdb is decoration.
    result_failure = continue
}

# App passwords — the credential a third-party mail client is GIVEN, so the
# person's real TatvaOS password never gets typed into somebody else's
# software. One row per app, revocable one at a time; rows carry their own
# {SCHEME} prefix so this store is immune to the default-scheme trap that
# silently broke the primary store's Argon2 hashes.
passdb {
    driver = sql
    args   = /etc/dovecot/dovecot-sql-app.conf.ext
}

# Every virtual user maps to the same system uid; the home path is derived
# from the address, so no per-user database lookup is needed here.
userdb {
    driver = static
    args   = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n allow_all_users=yes
}

# ----------------------------------------------------------------------------
# Services
# ----------------------------------------------------------------------------
service imap-login {
    inet_listener imap {
        port = 143
    }
    # Plain-text IMAP is intentionally the only listener locally.
    inet_listener imaps {
        port = 0
    }
}

service lmtp {
    # Postfix connects here over the Docker network to deliver.
    inet_listener lmtp {
        address = 0.0.0.0
        port    = 24
    }
}

service auth {
    unix_listener auth-userdb {
        mode  = 0600
        user  = vmail
        group = vmail
    }
}

protocol lmtp {
    postmaster_address = postmaster@techvein.local
    # Deliver to INBOX even if the maildir does not exist yet
    lmtp_save_to_detail_mailbox = no
}

protocol imap {
    mail_max_userip_connections = 20
}

# ----------------------------------------------------------------------------
# Environment overlay — WRITTEN BY THE ENTRYPOINT, absent on local.
#
# Production security lives in a file the entrypoint generates when
# TATVAOS_ENV is not "local": ssl=yes with the real certificate, plaintext
# auth disabled, IMAPS on 993, and the SASL listener Postfix's submission
# port authenticates against. It is an overlay rather than edits to this file
# because this file is ALSO local dev's config, and the last incident of
# "production behaviour described in a comment but shipped as dev" is exactly
# what this arrangement ends: the comment at the top of this file promised
# disable_plaintext_auth=yes in production while production ran `no` on an
# internet-published port 143.
# ----------------------------------------------------------------------------
!include_try /etc/dovecot/env-overrides.conf
