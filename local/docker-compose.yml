# ============================================================================
#  TatvaOS Mail - local development stack
# ============================================================================
#
#  Nothing here can send mail to the real internet. Postfix relays everything
#  outbound to Mailpit, which is a dead end with a web UI. That is deliberate:
#  a misconfigured dev stack that can reach the internet is how test messages
#  end up at real addresses and how a new IP range earns its first complaint.
#
#  Ports on the host are deliberately non-standard so they cannot collide with
#  anything Windows already has bound.
#
#    2525  -> postfix :25    inbound SMTP    (simulate the internet with swaks)
#    5870  -> postfix :587   submission      (authenticated send)
#    1143  -> dovecot :143   IMAP            (point Thunderbird here)
#    8025  -> mailpit :8025  web UI          (everything outbound lands here)
#    5432  -> postgres
#    6379  -> redis
#   11334  -> rspamd :11334  web UI
#
#    docker compose up -d
#    ./scripts/test-mail.sh
# ============================================================================

name: tatvaos-mail-local

services:

  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: tv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tatvaos_mail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      # C locale + explicit encoding keeps citext behaviour predictable
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files here run once, in filename order, on an EMPTY data directory only.
      # If you edit them you must `docker compose down -v` to see the change.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tatvaos_mail"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [mailnet]

  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tv-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks: [mailnet]

  # --------------------------------------------------------------------------
  #  Mailpit - catches ALL outbound. Nothing leaves your machine.
  # --------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: tv-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"      # web UI - open http://localhost:8025
    networks: [mailnet]

  # --------------------------------------------------------------------------
  #  OpenDKIM - signs outbound with the sending domain's own key
  # --------------------------------------------------------------------------
  #  Same image and same entrypoint as the cloud stack, so the signing path CI
  #  exercises is the one production runs. Keys arrive on the shared volume
  #  from the API; there is no separate local key-loading step to drift.
  # --------------------------------------------------------------------------
  opendkim:
    build:
      context: ./opendkim
    container_name: tv-opendkim
    restart: unless-stopped
    environment:
      # Lets the entrypoint generate throwaway keys for the seeded domains.
      # Anything other than "local" and it refuses — see the entrypoint.
      TATVAOS_ENV: local
    volumes:
      # Writable HERE only, because there is no API container locally to
      # materialise keys. The cloud stack mounts this read-only.
      - dkimkeys:/dkim
    networks: [mailnet]

  # --------------------------------------------------------------------------
  #  Postfix - MTA with Postgres-backed virtual domains, mailboxes and aliases
  # --------------------------------------------------------------------------
  postfix:
    build:
      context: ./postfix
    container_name: tv-postfix
    restart: unless-stopped
    hostname: mail.techvein.local
    depends_on:
      postgres:
        condition: service_healthy
      dovecot:
        condition: service_started
      opendkim:
        condition: service_started
    ports:
      - "2525:25"        # inbound  - swaks --server localhost:2525
      - "5870:587"       # submission
    volumes:
      # .tmpl: the entrypoint renders myhostname and relayhost into the real
      # file. Locally both keep their defaults, so nothing changes here — but
      # the SAME code path runs, which is the point. A render that only ever
      # executes on a server is a render nobody has tested.
      - ./postfix/main.cf:/etc/postfix/main.cf.tmpl:ro
      - ./postfix/master.cf:/etc/postfix/master.cf:ro
      # -src: the entrypoint renders /etc/postfix/sql from these. Same
      # mechanism as the cloud stack — one code path, so a change here
      # is exercised locally before it reaches a server.
      - ./postfix/sql:/etc/postfix/sql-src:ro
      - maillogs:/var/log
    networks: [mailnet]

  # --------------------------------------------------------------------------
  #  Dovecot - IMAP + LMTP, authenticating against Postgres
  # --------------------------------------------------------------------------
  dovecot:
    build:
      context: ./dovecot
    container_name: tv-dovecot
    restart: unless-stopped
    hostname: mail.techvein.local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1143:143"       # IMAP - point Thunderbird here
    volumes:
      - ./dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./dovecot/dovecot-sql.conf.ext:/etc/dovecot/dovecot-sql.conf.ext.tmpl:ro
      - vmail:/var/mail/vhosts
    networks: [mailnet]

  # --------------------------------------------------------------------------
  #  Rspamd - spam scoring. Optional locally; start it with:
  #      docker compose --profile spam up -d
  # --------------------------------------------------------------------------
  rspamd:
    image: rspamd/rspamd:latest
    container_name: tv-rspamd
    restart: unless-stopped
    profiles: [spam]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "11334:11334"    # web UI - http://localhost:11334
    volumes:
      - ./rspamd:/etc/rspamd/local.d:ro
      - rspamddata:/var/lib/rspamd
    networks: [mailnet]

  # --------------------------------------------------------------------------
  #  Roundcube - webmail UI for TESTERS.
  #
  #  apps/web does not exist until Phase 1, so non-technical testers would
  #  otherwise have nothing to click. Roundcube speaks IMAP to Dovecot and
  #  SMTP to Postfix exactly as any third-party client would - which makes it
  #  a genuine test of the server, not a simulation of one.
  #
  #      docker compose --profile testers up -d
  #      http://localhost:8000
  # --------------------------------------------------------------------------
  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: tv-roundcube
    restart: unless-stopped
    profiles: [testers]
    depends_on:
      dovecot:
        condition: service_started
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: dovecot
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_SMTP_SERVER: postfix
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_PLUGINS: archive,zipdownload,managesieve
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    ports:
      - "8000:80"
    volumes:
      - roundcubedata:/var/roundcube/db
    networks: [mailnet]

  # --------------------------------------------------------------------------
  #  Adminer - lightweight DB browser. Start with:
  #      docker compose --profile tools up -d
  #  (DBeaver on Windows connecting to localhost:5432 is usually nicer.)
  # --------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: tv-adminer
    restart: unless-stopped
    profiles: [tools]
    ports:
      - "8080:8080"
    networks: [mailnet]

networks:
  mailnet:
    driver: bridge

volumes:
  dkimkeys:
  pgdata:
  roundcubedata:
  redisdata:
  vmail:
  maillogs:
  rspamddata:
