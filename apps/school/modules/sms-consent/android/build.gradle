plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.techvein.tatvaos.school'
version = '1.0.0'

android {
  namespace "com.techvein.tatvaos.school.smsconsent"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Android's SMS User Consent API (Google Play services)
  implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'
}
