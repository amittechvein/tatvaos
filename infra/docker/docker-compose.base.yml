# ============================================================================
#  TatvaOS Mail — shared service definitions
# ============================================================================
#
#  Never used alone. Combined with an environment overlay:
#
#      docker compose -f docker-compose.base.yml \
#                     -f docker-compose.production.yml up -d
#
#  Production is the only cloud overlay today; the contained "testing" one was
#  removed when this box was promoted. Local development uses local/ instead.
#
#  Everything environment-specific — ports, domains, resource limits, whether
#  outbound mail can leave the box — lives in the overlay. Keeping the base
#  free of those means any future environment runs the SAME service
#  definitions, which is the only way a test result means anything.
# ============================================================================

# ----------------------------------------------------------------------------
#  NO `name:` HERE — EVERY OVERLAY DECLARES ITS OWN. READ THIS BEFORE ADDING ONE.
#
#  The Compose project name determines which containers and which NAMED VOLUMES
#  a command acts on. It used to live in this file, which meant every checkout
#  on a box — production and testing alike — resolved to the same project
#  `tatvaos` and therefore the same `tatvaos_pgdata` and `tatvaos_vmail`.
#
#  The consequence was not theoretical. `docker compose down -v` run from a
#  testing checkout, intending to tear down testing, would have deleted
#  PRODUCTION's database and every customer's mail — because the directory you
#  type the command in has no bearing on which project it targets. Only the
#  name does.
#
#  So the name belongs to the environment, not to the shared definitions. An
#  overlay without one falls back to the directory name, which is a confusing
#  default but a SAFE one: it cannot collide with a deliberately-named project.
# ----------------------------------------------------------------------------

services:

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tatvaos_mail}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Read by 03-role-passwords.sql. The schema creates tatvaos_app with a
      # development password; without this the API authenticates with the
      # generated secret from .env against a role that still has 'dev_app_pw',
      # and every query fails while the container reports itself Up.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set}
      # Same story for the mail edge. Postfix and Dovecot render their config
      # from this at start; 03-role-passwords.sql rotates the role from it.
      # Both halves must move together or mail delivery stops.
      MAILEDGE_DB_PASSWORD: ${MAILEDGE_DB_PASSWORD:?MAILEDGE_DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tatvaos_mail}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [mailnet]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [mailnet]

  opendkim:
    build:
      context: ../../local/opendkim
    restart: unless-stopped
    volumes:
      # READ-ONLY. The signer must never be able to write a key — only the API
      # generates them, and only it should be able to.
      - dkimkeys:/dkim:ro
    networks: [mailnet]

  postfix:
    build:
      context: ../../local/postfix
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      dovecot:  { condition: service_started }
      # milter_default_action is tempfail, so Postfix starting first would
      # defer every message until the signer appeared. Cheap to order.
      opendkim: { condition: service_started }
    environment:
      # The .cf files in source control say 'dev_mail_pw'. The entrypoint
      # renders real ones from sql-src at start, so the password never sits in
      # the repo or in an image layer. Unset is fatal unless TATVAOS_ENV=local.
      MAILEDGE_DB_PASSWORD: ${MAILEDGE_DB_PASSWORD:?MAILEDGE_DB_PASSWORD must be set}
      TATVAOS_ENV: ${TATVAOS_ENV:-local}
      # What Postfix announces in HELO. Receivers check it against our PTR, so
      # this and the reverse DNS record must be the same name.
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.techvein.local}
      # Defaults to CONTAINED. Getting this wrong in the safe direction means
      # test mail piles up in Mailpit; wrong in the other direction means test
      # mail reaches real people, which cannot be undone.
      RELAY_TO_MAILPIT: ${RELAY_TO_MAILPIT:-true}
      RELAY_HOST: ${RELAY_HOST:-}
    volumes:
      # ONE source of truth, shared with the local stack and CI.
      #
      # These used to be separate copies under infra/. They drifted: the
      # deployed ones still queried pre-restructure table names (domains,
      # mailboxes) that have lived in core.* and mail.* for some time, so
      # every recipient lookup on a server would have failed. CI only ever
      # built the local/ copies, so nothing caught it.
      #
      # The build context is already ../../local/postfix. Config now follows
      # it, and the environment-specific values are rendered by the entrypoint
      # from MAIL_HOSTNAME / RELAY_TO_MAILPIT rather than by keeping a second
      # file.
      - ../../local/postfix/main.cf:/etc/postfix/main.cf.tmpl:ro
      - ../../local/postfix/master.cf:/etc/postfix/master.cf:ro
      - ../../local/postfix/sql:/etc/postfix/sql-src:ro
      - maillogs:/var/log
    networks: [mailnet]

  dovecot:
    build:
      context: ../../local/dovecot
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      MAILEDGE_DB_PASSWORD: ${MAILEDGE_DB_PASSWORD:?MAILEDGE_DB_PASSWORD must be set}
      TATVAOS_ENV: ${TATVAOS_ENV:-local}
    volumes:
      # Same single source as Postfix. The infra/ copy was stale in a way that
      # mattered: it selected m.password_hash (renamed to imap_password_hash)
      # and omitted the suspended-user check, so a person suspended in Core
      # could still have authenticated to IMAP.
      - ../../local/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      # As a template. The entrypoint renders the real file, because Dovecot
      # refuses to read a config holding a password that is group-readable —
      # and a read-only bind mount cannot be chmod-ed.
      - ../../local/dovecot/dovecot-sql.conf.ext:/etc/dovecot/dovecot-sql.conf.ext.tmpl:ro
      - vmail:/var/mail/vhosts
    networks: [mailnet]

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    # Runs as vmail (uid/gid 5000) — the SAME user Dovecot writes the maildir
    # as. Dovecot makes every maildir private (0700, owner vmail), so the
    # ingest worker can only read inbound mail if it IS that user. Non-root
    # (a container escape still lands on an unprivileged account), and the
    # maildir stays mounted read-only below so the API still cannot write it.
    # The image's /dkim is chowned to 5000 to match — see apps/api/Dockerfile.
    user: "5000:5000"
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - dkimkeys:/dkim
      # READ-ONLY. The ingest worker indexes what Dovecot delivered into
      # mail.messages; it must never be able to write the maildir — one
      # writer per store, and Dovecot is the maildir's.
      - vmail:/var/mail/vhosts:ro
      # Space's file bytes. WRITABLE, unlike the maildir — the API is this
      # volume's ONE writer. The named volume is created root-owned, and the
      # container runs as 5000, so the FIRST deploy must chown it once:
      #   docker run --rm -v tatvaos_spaceblobs:/b alpine chown 5000:5000 /b
      # (same one-time step dkimkeys needed; see the deploy checklist).
      - spaceblobs:/var/lib/space/blobs
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-tatvaos_mail};Username=tatvaos_app;Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD must be set};Pooling=true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: tatvaos-mail
      # Empty = host-only cookies, which is right when one host serves
      # everything. ".tatvaos.com" in production so a session started in Core
      # is carried to Mail. See the cookie-domain block in AuthEndpoints.
      Auth__CookieDomain: ${AUTH_COOKIE_DOMAIN:-}
      # Where DKIM private keys are written for OpenDKIM to read. The API is
      # the only writer; the signer mounts the same volume read-only.
      Dkim__KeyDirectory: /dkim
      # Where Space writes file bytes — the volume above. The database holds
      # opaque blob keys only; see apps/api/Modules/Space/BlobStore.cs.
      Space__BlobRoot: /var/lib/space/blobs
      # Creates the first super admin if none exists, then does nothing on
      # every later start. Blank is fine and normal once you have signed in
      # once - see apps/api/Shared/Auth/BootstrapAdmin.cs.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # The mail host customers point their MX at, and the SPF include we ask
      # them to add. DomainVerifier checks against exactly these values, so the
      # records shown on screen and the records tested are the same strings.
      # tatvaos.com, deliberately — NOT a customer's domain.
      #
      # Every customer's MX record points at Mail__Host forever. If that
      # hostname lived inside a domain that were also a tenant, the day that
      # domain moved or expired would break mail for every organisation on the
      # platform. Infrastructure identity stays separate from any customer.
      # mx, not mail. mail.tatvaos.com already points at Bluehost's shared
      # mail server and may have live mailboxes behind it — repointing it to
      # take over the name would break whatever is there. A hostname nothing
      # is using costs nothing and removes the risk entirely.
      Mail__Host: ${MAIL_HOST:-mx.tatvaos.com}
      # System mail (OTP codes, later invoices) goes out through our own
      # Postfix submission port. On testing that relays to Mailpit, so signup
      # codes are readable at mail-catcher.staging rather than emailing anyone.
      Smtp__Host: postfix
      Smtp__Port: "587"
      Smtp__From: ${SMTP_FROM:-no-reply@tatvaos.com}
      Mail__SpfInclude: ${MAIL_SPF_INCLUDE:-_spf.tatvaos.com}
      # Zone new organisations get their free sign-in subdomain under.
      Mail__PlatformZone: ${MAIL_PLATFORM_ZONE:-tatvaos.com}
      # One-off thread_id repair for mail stored before threading existed.
      # Empty - the default, and where it belongs the rest of the time - means
      # the worker returns immediately. "report" logs what it would do and
      # writes nothing; "run" commits it. Set MAIL_THREAD_BACKFILL to use it.
      Mail__ThreadBackfill: ${MAIL_THREAD_BACKFILL:-}
      # host:port of a clamd. Empty - the default - means attachments are not
      # scanned and every row honestly stays "pending". Set it to clamav:3310
      # once the service below is running.
      Mail__ClamAv: ${MAIL_CLAMAV:-}
      # Over-quota mailboxes: anything but "enforce" only LOGS would-defer
      # lines. Flip to enforce only after reading those logs shows no
      # innocent mailbox would be hit — a 4xx defer makes senders queue and
      # retry, which is recoverable, but still not something to switch on
      # blind.
      Mail__QuotaEnforcement: ${MAIL_QUOTA_ENFORCEMENT:-}
    # No healthcheck. The .NET runtime image has neither wget nor curl, so this
    # check could never pass - the container reported "unhealthy" while serving
    # traffic fine. See the reasoning in apps/api/Dockerfile; liveness is
    # covered by restart:unless-stopped and the deploy workflow's external
    # smoke test against /health.
    networks: [mailnet]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_started }
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      NODE_ENV: production
    networks: [mailnet]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # The Caddyfile is written in terms of {$SITE_DOMAIN}. Without this block
    # the variable is empty inside the container, Caddy reads a site address of
    # "", refuses the config and exits - which presents as an endless restart
    # loop with every other service healthy.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must be set}
      # Blank on staging, where one host serves everything. Caddy tolerates an
      # empty site block; it simply matches nothing.
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      FAMILY_DOMAIN: ${FAMILY_DOMAIN:-}
      # Space. Blank default like the others: a variable with no matching
      # conf.d file is harmless, while a conf.d file with no variable makes
      # Caddy reject the WHOLE config and restart-loop — taking Core, Mail and
      # Family down with it. Add the variable before the site file, never after.
      SPACE_DOMAIN: ${SPACE_DOMAIN:-}
      ACCOUNT_DOMAIN: ${ACCOUNT_DOMAIN:-}
      CALENDAR_DOMAIN: ${CALENDAR_DOMAIN:-}
      CONNECT_DOMAIN: ${CONNECT_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [mailnet]

  # --------------------------------------------------------------------------
  #  Connect's media path — Phase 0. Two services, both infrastructure:
  #  business logic stays in the API monolith (docs/CONNECT_BRIEF.md §2).
  #  Ports, ranges and the no-overlap rule are documented in
  #  infra/docker/livekit.yaml and docs/CONNECT_PHASE0.md.
  # --------------------------------------------------------------------------

  livekit:
    # Floating tag so review is not blocked on guessing a release; pin the
    # digest on the box in the follow-up commit (see docs/CONNECT_PHASE0.md).
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # "key: secret" — the ONLY place the LiveKit credential pair exists.
      # The API reads the same two variables later to mint room-scoped
      # tokens; a browser only ever sees short-lived JWTs (brief §7).
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # Media over UDP, 1:1 with rtc.port_range_* in livekit.yaml — the
      # server advertises the box's public IP (use_external_ip), so the
      # mapping must not renumber. Signalling (7880) is NOT published:
      # Caddy proxies it at connect.tatvaos.com/rtc under the existing
      # certificate, and media never passes through Caddy at all.
      - "50000-50199:50000-50199/udp"
      # ICE over TCP — fallback for networks that drop UDP outright.
      - "7881:7881"
    networks: [mailnet]

  coturn:
    image: coturn/coturn:alpine
    restart: unless-stopped
    # Host networking, deliberately: a TURN relay allocates from its whole
    # relay range on demand, and publishing hundreds of UDP ports through
    # the docker proxy one by one is the overhead this skips. The relay
    # range 49160–49999 must NOT overlap LiveKit's 50000–50199 above —
    # change either only together.
    network_mode: host
    command: [
      "-n",
      "--log-file=stdout",
      "--fingerprint",
      "--lt-cred-mech",
      "--no-multicast-peers",
      "--realm=tatvaos.com",
      "--listening-port=3478",
      # Pin BOTH to the public address. Left to itself coturn discovers every
      # local address and will happily allocate a relay on a docker bridge
      # (172.17.0.1, 172.18.0.1) — unreachable from the internet, and with
      # --external-ip rewriting the candidate the client is told to use, that
      # allocation fails SILENTLY instead of loudly. Pinning makes every
      # allocation reachable, and stops coturn listening on the bridges.
      "--listening-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP must be set}",
      "--relay-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP must be set}",
      "--min-port=49160",
      "--max-port=49999",
      # Static credential for Phase 0; values live in .env, never here —
      # the postgres-password rule. Rotating use-auth-secret is the
      # follow-up recorded in docs/CONNECT_PHASE0.md.
      "--user=${TURN_USERNAME:?TURN_USERNAME must be set}:${TURN_PASSWORD:?TURN_PASSWORD must be set}",
      # The box's public IPv4. TURN writes it into relay candidates, and a
      # wrong value fails at call time rather than at start — so it is
      # required, not defaulted.
      "--external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP must be set}",
    ]


networks:
  mailnet:
    driver: bridge

volumes:
  dkimkeys:
  spaceblobs:
  pgdata:
  redisdata:
  vmail:
  maillogs:
  caddydata:
  caddyconfig:
