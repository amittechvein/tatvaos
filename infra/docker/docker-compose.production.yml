# ============================================================================
#  PRODUCTION overlay
# ============================================================================
#
#  Differences from testing, each for a reason:
#
#   1. NO Mailpit. Outbound goes to the real internet — or to the configured
#      relay. This is the only environment where that is true.
#   2. NO Roundcube. Customers use our own client.
#   3. NO database port published, not even on loopback. Reach it through the
#      API or an SSH session, never over the network.
#   4. Real MX ports (25, 587, 143, 993) rather than the shifted test ports.
#   5. Larger limits, and log rotation, because this box is expected to stay
#      up rather than be rebuilt on a whim.
# ============================================================================

services:

  caddy:
    # Adds the Mail front door. Staging does not mount this, so its import
    # matches nothing and one host keeps serving everything.
    volumes:
      - ./conf.d:/etc/caddy/conf.d:ro

  postgres:
    # No ports section at all. Deliberate — the database is not on the network.
    deploy:
      resources:
        limits: { memory: 2G }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  redis:
    deploy:
      resources:
        limits: { memory: 512M }

  postfix:
    # mx., NOT mail. — mail.tatvaos.com is the WEBMAIL host, and this name goes
    # out in the SMTP HELO and in every Received header. Receiving servers
    # check that it resolves and that the PTR for our IP matches it, so a
    # mismatch here costs deliverability rather than throwing an error.
    hostname: mx.tatvaos.com
    ports:
      - "25:25"      # inbound from the internet
      - "587:587"    # authenticated submission
    environment:
      # Read by the entrypoint, which renders relayhost in main.cf from it.
      # It used to be set here and read by nothing — main.cf hardcoded
      # relayhost = [mailpit]:1025 in BOTH environments, so this switch was
      # decorative and production would have deferred every message forever.
      RELAY_TO_MAILPIT: "false"
      RELAY_HOST: ${RELAY_HOST:-}
      # Must match the PTR for this IP. The entrypoint refuses to start on a
      # .local name outside local development.
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mx.tatvaos.com}
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "10" }

  dovecot:
    hostname: mail.tatvaos.com
    ports:
      - "143:143"
      - "993:993"
    logging:
      driver: json-file
      options: { max-size: "100m", max-file: "10" }

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    deploy:
      resources:
        limits: { memory: 1G }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  web:
    environment:
      NEXT_PUBLIC_ENVIRONMENT: production
